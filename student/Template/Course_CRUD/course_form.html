{% extends "base.html" %}

{% block title %}
Adding Course to Database
{% endblock %}

{% block content %}
<h2>Course Form</h2>
<form method="post">
    {% csrf_token %}
    <div class="form-group">
        {{ form.as_p}}
        <button type="submit" class="btn btn-primary">Submit</button>
    </div>
</form>
<a href="{% url 'course_list' %}">
    Back to Course List
</a>
{% endblock %}
