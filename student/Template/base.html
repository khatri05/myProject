<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Django Project{% endblock %}</title>
    
    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    {% load static %}
    <link href="{% static 'css/style.css' %}" rel="stylesheet" />
    

    <!-- Bootstrap Icons -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
          <img
            src="{% static 'images/logo.png' %}" alt="Logo"
          />

          Django Project
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'about' %}"> About </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{% url 'contact' %}"> Contact </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="main-container">{% block content %} {% endblock %}</div>

    <footer>
      <h5>Django Project</h5>

      <p class="mb-2">Built with ❤️ using Django & Bootstrap 5</p>

      <div>
        <i class="bi bi-github"></i>

        <i class="bi bi-linkedin"></i>

        <i class="bi bi-envelope-fill"></i>
      </div>

      <p class="mt-3 mb-0">© 2026 Django Project. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>
